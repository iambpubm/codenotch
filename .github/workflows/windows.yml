name: Windows

# The port under windows/ is Rust, and CI and Package only ever run Xcode, so a
# Windows change could merge on a green check that never compiled it. Its own
# file, so those two stay about the Mac app.
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  # Added by this fork. `tauri build` compiles the binary only, so the unit
  # tests never get built by the packaging job; a manual entry point is the
  # only way to run `cargo test` here.
  workflow_dispatch:

jobs:
  build:
    # Upstream gated this on its own repository name. This fork builds itself,
    # so the gate only keeps a stranger's pull request from spending the minutes.
    if: github.event_name != 'pull_request'
    name: Build and test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      # First, and quick: cargo never reads the pages, so a syntax error in
      # their script stays green through the build and ships as an empty
      # window. Node is already on the runner.
      - name: Check the UI pages parse
        run: node scripts/check-ui-scripts.mjs

      - name: Test light surface theme
        run: node --test test-light-surface.cjs

      - name: Test Korean card localization
        run: node --test scripts/test-ko-i18n.cjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Tauri and the windows crate make a cold build several minutes long.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      # No `--locked`: this fork replaced two providers, so Cargo.toml no longer
      # matches the committed lock. Letting cargo re-resolve it here is the only
      # way the build can pick up `zstd` and drop `tiny_http` / `notify`.
      - name: Build
        run: cargo build

      # The build above rewrote the lock. Hand it back so the re-resolved file
      # can be committed and `--locked` turned on again; until that happens every
      # run re-resolves from the registry and the build is not reproducible. Drop
      # this step once Cargo.lock is current again.
      - name: Offer the re-resolved lock
        uses: actions/upload-artifact@v7
        with:
          name: Cargo.lock
          path: windows/Cargo.lock
          if-no-files-found: error

      - name: Test
        run: cargo test

      - name: Test Codex headline selection
        run: node --test test-codex-headline.cjs

      # Reported rather than enforced: the crate already carries warnings, and
      # failing on them would hold every change hostage to that cleanup.
      - name: Clippy
        run: cargo clippy --all-targets
