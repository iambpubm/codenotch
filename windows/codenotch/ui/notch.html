<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* The palette. Dark is the notch as it has always been drawn; light is the same shapes in the
     inks Settings already uses, plus the Mac's own light secondary (#6b6b6b, Palette.textSecondary).
     Which of the two is drawn is Rust's answer to get_theme_resolved, never a guess made here. */
  :root{
    --pill:#000; --edge:#2e2e2e; --rest-edge:#5c5c5c; --card:#0a0a0a; --card-line:#242424; --card-rule:#1e1e1e;
    --bar:#2d2d2d; --track:#303030; --hole:#2a2a2a;
    --ample:#00FF88; --watch:#F2FF00; --crit:#FF3F00;
    --ink:#ffffff; --ink-2:#e8e8ea; --ink-3:#c8c8c8; --ink-4:#b0b0b3; --ink-dim:#808080;
    --btn:#252525; --btn-line:#555; --btn-hover:#383838; --btn-line-hover:#aaa;
    --armed:rgba(0,0,0,.72);
  }
  /* Rust resolves the choice — Light, Dark, or what Windows is set to — and the page is told, rather
     than reading prefers-color-scheme: correcting a live window's theme does not reliably reach
     WebView2's own scheme, which left a dark page under a light Mica. */
  :root[data-theme="light"]{
    --pill:#f5f5f7; --edge:#d2d2d7; --rest-edge:#86868b; --card:#ffffff; --card-line:#e4e4e8; --card-rule:#e8e8ec;
    --bar:rgba(0,0,0,.15); --track:rgba(0,0,0,.16); --hole:#ffffff;
    /* Palette.ample and .watch carry a light value of their own; .critical is "already 3.5:1 on
       white", in its words, so it is the one band that does not change. */
    --ample:#00A356; --watch:#B08800; --crit:#FF3F00;
    --ink:#1d1d1f; --ink-2:#1d1d1f; --ink-3:#3c3c43; --ink-4:#4a4a4f; --ink-dim:#6b6b6b;
    --btn:#ffffff; --btn-line:#c6c6cc; --btn-hover:#f0f0f2; --btn-line-hover:#8e8e93;
    --armed:rgba(255,255,255,.78);
  }
  .c-auth{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .c-auth button{font:inherit;font-size:11px;color:var(--ink);background:var(--btn);border:1px solid var(--btn-line);border-radius:7px;padding:6px 9px;cursor:pointer}
  .c-auth button:hover,.c-auth button:focus-visible{background:var(--btn-hover);border-color:var(--btn-line-hover)}
  .c-auth button:disabled{opacity:.5;cursor:wait}
  .c-auth-status{font-size:10px;line-height:1.4;color:var(--ink-3);margin-top:6px;overflow-wrap:anywhere}
  /* Visual reference: upstream docs/specs/2026-08-28-usage-notch-design.md, reproduced for Windows */
  *{box-sizing:border-box} /* content-box padding once pushed the card past the window's left edge */
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}
  #root{position:relative;width:100%;height:100%}

  /* The pill on the right edge */
  #pill{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:70px;padding:18px 0;background:var(--pill);
    border-radius:20px 0 0 20px;
    /* Stays visible on dark wallpapers: a thin stroke plus a faint glow, the only outline when black sits on black */
    border:1px solid var(--edge);border-right:none;
    box-shadow:none;
    display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;
  }
  /* Fillets: the concave arcs between the pill's top/bottom and the screen edge (the inverse rounded
     corner in the upstream design frame). An R×R black square hugs the edge and a radial gradient
     punches out the circle of radius R centred on its outer corner; what remains is the arc. A 1 px
     ring in the stroke colour joins the pill's own stroke (the outline cue on black wallpapers). */
  #pill::before,#pill::after{
    content:"";position:absolute;right:0;width:var(--fillet);height:var(--fillet);pointer-events:none;
  }
  /* The Mac's flare radius (38.7 pt against the same 70 pt body), so the settings orb that nests in
     this pocket can be the Mac's own size */
  #pill{--fillet:38.7px}
  #pill::before{
    top:calc(-1 * var(--fillet)); /* covers the 1 px stroke along the pill's top edge so there is no seam */
    background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px));
  }
  #pill::after{
    bottom:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px));
  }
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  /* The ring takes the Mac's own share of the body, NotchLayout.ringDiameter against sideBodyDepth: 44 in
     70. At 56 it left an outside weekly ring 2.8 px from the screen edge, where the Mac keeps it about 10
     clear ("far enough in that the bezel is never touched"). The arcs are drawn in a 56-unit viewBox and
     scale with the ring on their own; the glyphs are sized here in px, so they take the same factor. */
  :root{--ring:44px;--k:calc(44 / 56)}
  .ringwrap{position:relative;width:var(--ring);height:var(--ring);transition:transform .3s cubic-bezier(.34,1.4,.64,1)}
  .ringwrap.pressed{transform:scale(.93)}
  .ringwrap > svg.ring,.ringwrap > svg.reading,.ringwrap > svg.activity{position:absolute;inset:0;overflow:visible} /* pins only the ring itself; an inline logo svg must not match this or it ends up in the top-left corner */
  .glyph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:calc(20px * var(--k));font-weight:700;color:var(--ink-2);letter-spacing:-.5px;
  }
  .glyph.small{font-size:calc(15px * var(--k))}
  /* Glyphs: mark = the provider's own brand mark (monochrome, shown white); appicon = the installed app's icon (colour, rounded and shrunk) */
  .glyph img,.glyph svg{display:block;pointer-events:none;user-select:none}
  .glyph .mark{display:block;width:calc(26px * var(--k));height:calc(26px * var(--k));color:var(--ink-2)}
  .glyph .mark svg{width:calc(26px * var(--k));height:calc(26px * var(--k));fill:currentColor} /* inline SVG follows currentColor, so it dims together with the cell */
  .glyph img.png{width:calc(26px * var(--k));height:calc(26px * var(--k));object-fit:contain}
  .glyph img.appicon{width:calc(30px * var(--k));height:calc(30px * var(--k));border-radius:calc(8px * var(--k));object-fit:cover}
  .c-head .mark{display:inline-block;width:16px;height:16px;color:var(--ink-2);margin-right:2px}
  .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  /* nowrap so an unexpectedly long reading cannot fold the pill into two lines; `compactCount` keeps it
     inside the 70 px body, so this never actually hides anything. */
  .pct{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* The business group: the workbench's three counts, told apart from the providers by a hairline.
     The pill is a column, so the separator is a rule across its width — a plain gap would read as
     "one more provider", which is exactly what these three are not. */
  .sep{width:calc(var(--ring) - 14px);height:1px;background:var(--ink-dim);opacity:.4}
  /* A count has no denominator, so the ring is a frame around the number rather than a filled arc.
     The number is sized by how many characters it has: `compactCount` caps that at five, and five
     would not fit the ring at the size three does. */
  .bnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.5px;
    font-size:calc(19px * var(--k))}
  .bnum.w2{font-size:calc(15.5px * var(--k))}
  .bnum.w3{font-size:calc(12.5px * var(--k))}
  /* Rows on the workbench card. The date carries its own weight: a past one is drawn in the same red
     as the count above it, so "late" is a colour rather than a phrase that would need translating. */
  .s-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
  .s-meta{flex:none;color:var(--ink-dim);white-space:nowrap}
  .s-meta.late{color:var(--crit)}
  .c-count{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
  .dim{opacity:.55}
  /* A stale reading dims the reading only. The track, the week and the glyph are all saying the same
     old thing, but whether an agent is running right now is current either way, so the activity arc
     keeps its strength — the Mac puts its own ActivityArc outside the opacity it gives the stale
     stack (ProviderRing), and TASKS.md says it outright: dimming applies to the usage reading. */
  .ringwrap.stale > svg.ring,.ringwrap.stale > svg.reading,.ringwrap.stale > .glyph{opacity:.55}
  /* Session arc animation */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* A 60 fps SVG transform animation in a transparent always-on-top window slows the whole desktop
     compositor (other apps stutter). steps() drops repaints to ~10 fps; it still reads as spinning/breathing. */
  .arc-spin{animation:spin 1.2s steps(12) infinite;transform-origin:center}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}
  /* Windows' Animation effects switch: a still arc and a solid ring, as on the Mac under Reduce Motion */
  @media (prefers-reduced-motion: reduce){.arc-spin,.arc-pulse{animation:none}.ringwrap{transition:none}}

  /* Hover card, shown to the left of the pill */
  #card{
    position:absolute;left:10px;right:100px;top:50%;transform:translateY(-50%);
    /* Anchored on both sides = fluid width: whatever the WebView's real logical width, the card cannot
       extend past the window's left edge (a fixed max-width got clipped when the DPI disagreed).
       The 246 cap matches the upstream spec. */
    max-width:246px;margin-left:auto;background:var(--card);border-radius:16px;padding:16px;
    overflow-wrap:anywhere;min-width:0;
    max-height:calc(100% - 16px);overflow-x:hidden;overflow-y:auto;scrollbar-width:thin; /* actions stay reachable in a tall card */
    display:none;
  }
  #card.show{display:block}
  /* The tail, its point on the hovered ring: the Mac's curved wedge (TooltipTail), whose shoulders
     leave the card tangent to its edge so the two read as one shape. An element of its own rather
     than ::after, so the card's overflow cannot clip it and it can be reported as hot. It spans the
     whole gap, its tip tucked 1 px under the pill's edge so the two meet. */
  #tail{
    position:absolute;right:69px;width:32px;height:36px;background:var(--card);display:none;
    clip-path:path('M0 0C0 9 18.56 13.68 32 18C18.56 22.32 0 27 0 36Z');
  }
  #card.show + #tail{display:block}
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .c-title{font-size:14px;font-weight:700}
  .c-sub{font-size:11px;color:var(--ink-dim);margin-bottom:10px}
  .win{margin-top:10px}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex-wrap:wrap;column-gap:8px}
  .w-label{color:var(--ink-2);font-weight:600;white-space:nowrap}
  .w-reset{color:var(--ink-dim);font-size:11px;white-space:nowrap;margin-left:auto} /* wrap as a whole when it does not fit; never break inside a word */
  .w-track{height:4px;border-radius:2px;background:var(--bar);margin:6px 0 4px;overflow:hidden}
  .w-fill{height:100%;border-radius:2px}
  .w-used{font-size:11px;color:var(--ink-dim)}
  /* The money half of a count window: the token figure stays the one the eye lands on and the amount
     it works out to rides beside it, dimmer, because the tokens are the measurement and the money is
     the consequence. */
  .w-money{color:var(--ink-3);font-variant-numeric:tabular-nums}
  .w-money::before{content:' · '}
  /* What a meter cannot say: a ring at 13.5% is the same picture at 173,000 credits and at
     1,730,000, so the absolute remainder gets its own line rather than an invented proportion. */
  .w-left{font-size:11px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
  /* The spend breakdown, when the provider's own history can be priced. Fenced off like the session
     list, because it is a different kind of claim: everything above is what the vendor said, and
     this is what this machine worked out. */
  .c-cost{margin-top:12px;border-top:1px solid var(--card-rule);padding-top:8px}
  .c-cost-head{font-size:12px;font-weight:700;color:var(--ink-2)}
  .c-cost-row{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink-4);padding:2px 0}
  .c-cost-row.total{color:var(--ink-2);font-weight:600;border-top:1px solid var(--card-rule);margin-top:2px;padding-top:4px}
  .c-cost-num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .c-cost-note{font-size:11px;color:var(--ink-dim);line-height:1.5;margin-top:4px}
  .g-head{font-size:12px;font-weight:700;color:var(--ink-2);margin-top:12px}
  .g-box{border:1px solid var(--card-line);border-radius:10px;padding:0 10px 8px;margin-top:6px}
  .c-note{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:6px}
  .c-sessions{margin-top:12px;border-top:1px solid var(--card-rule);padding-top:8px}
  .s-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-4);padding:2px 0}
  .s-dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto}
  .s-more{font-size:11px;color:var(--ink-dim);padding:2px 0}

  /* ---- The other three edges -------------------------------------------------
     The rules above draw the right-hand edge, the original layout and still the default. Each block
     below mirrors or rotates that one for another edge. Two things stay in JavaScript because they
     depend on measurement: where the card and the tail sit along the pill (`placeCard`), and, on the
     flat edges, how far down or up the card clears a pill whose thickness follows its contents.

     The fillets follow one rule on every edge: the radial gradient is centred on the corner of the
     R×R square *diagonally opposite* the corner where the pill meets the screen, so what stays black
     is the concave arc between the two. */

  /* Left: the right-hand layout mirrored. */
  body[data-edge="left"] #pill{right:auto;left:0;border-radius:0 20px 20px 0;border-right:1px solid var(--edge);border-left:none}
  body[data-edge="left"] #pill::before,body[data-edge="left"] #pill::after{right:auto;left:0}
  body[data-edge="left"] #pill::before{background:radial-gradient(circle at 100% 0, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="left"] #pill::after{background:radial-gradient(circle at 100% 100%, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="left"] #card{left:100px;right:10px;margin-left:0;margin-right:auto}
  body[data-edge="left"] #tail{right:auto;left:69px;clip-path:path('M32 0C32 9 13.44 13.68 0 18C13.44 22.32 32 27 32 36Z')}

  /* Top and bottom: the pill lies flat, so it is a row and its thickness comes from the cells rather
     than a fixed 70 px column. The card is centred under (or over) the hovered ring by `placeCard`. */
  body[data-edge="top"] #pill,body[data-edge="bottom"] #pill{
    right:auto;left:50%;top:auto;transform:translateX(-50%);
    flex-direction:row;width:auto;height:auto;padding:12px 18px;
  }
  body[data-edge="top"] #pill::before,body[data-edge="top"] #pill::after,
  body[data-edge="bottom"] #pill::before,body[data-edge="bottom"] #pill::after{right:auto;top:auto;bottom:auto}
  body[data-edge="top"] #pill{top:0;border-radius:0 0 20px 20px;border-top:none}
  body[data-edge="top"] #pill::before{top:0;left:calc(-1 * var(--fillet));background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="top"] #pill::after{top:0;right:calc(-1 * var(--fillet));background:radial-gradient(circle at 100% 100%, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="bottom"] #pill{bottom:0;border-radius:20px 20px 0 0;border-bottom:none}
  body[data-edge="bottom"] #pill::before{bottom:0;left:calc(-1 * var(--fillet));background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="bottom"] #pill::after{bottom:0;right:calc(-1 * var(--fillet));background:radial-gradient(circle at 100% 0, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  /* A fixed width here, not the fluid one the upright edges use: `placeCard` measures the card to
     centre it, and a shrink-to-fit width would change as it moves. 246 is the upstream cap either way. */
  body[data-edge="top"] #card,body[data-edge="bottom"] #card{
    left:8px;right:auto;top:0;transform:none;margin-left:0;
    width:246px;max-height:calc(100% - 150px);
  }
  body[data-edge="top"] #tail,body[data-edge="bottom"] #tail{right:auto;width:36px;height:32px}
  body[data-edge="top"] #tail{clip-path:path('M0 32C9 32 13.68 13.44 18 0C22.32 13.44 27 32 36 32Z')}
  body[data-edge="bottom"] #tail{clip-path:path('M0 0C9 0 13.68 18.56 18 32C22.32 18.56 27 0 36 0Z')}

  /* Show on hover, the Mac's .onHover: folded, the notch rests as a small pill at the edge. Its size is
     the Mac's NotchLayout.pillWidth × pillHeight, 26 × 210 of its design px — 10 × 79 of this page's,
     the same unscaled measures the orb and the fillets use. The open pill keeps its whole layout and is
     clipped down to that, so everything measured off it (the card's anchor, the handles, which ring is
     under the pointer) stays true; `#rest` draws the outline the clip takes away, which is the only
     thing that shows a black pill against a black wallpaper. */
  #pill{--clip-open:inset(-40px -1px -40px -1px round 0);
    --clip-rest:inset(calc(50% - 39.5px) 0 calc(50% - 39.5px) calc(100% - 10px) round 6px 0 0 6px);
    clip-path:var(--clip-open);transition:clip-path .36s cubic-bezier(.32,.72,.24,1)}
  body.folded #pill{clip-path:var(--clip-rest)}
  body[data-edge="left"] #pill{--clip-rest:inset(calc(50% - 39.5px) calc(100% - 10px) calc(50% - 39.5px) 0 round 0 6px 6px 0)}
  body[data-edge="top"] #pill,body[data-edge="bottom"] #pill{--clip-open:inset(-1px -40px -1px -40px round 0)}
  body[data-edge="top"] #pill{--clip-rest:inset(0 calc(50% - 39.5px) calc(100% - 10px) calc(50% - 39.5px) round 0 0 6px 6px)}
  body[data-edge="bottom"] #pill{--clip-rest:inset(calc(100% - 10px) calc(50% - 39.5px) 0 calc(50% - 39.5px) round 6px 6px 0 0)}
  /* That outline is all there is of a pill on a backdrop of its own colour, a black pill on a black
     wallpaper or a light one on a white page, so it has an edge of its own: at least 3:1 against the
     pill's fill in either palette, where --edge is 1.5:1. */
  #rest{position:absolute;box-sizing:border-box;background:var(--pill);border:1px solid var(--rest-edge);pointer-events:none;
    right:0;top:50%;translate:0 -50%;width:10px;height:79px;border-right:none;border-radius:6px 0 0 6px;
    opacity:0;transition:opacity .16s ease,background-color .3s ease,border-color .3s ease}
  body.folded #rest{opacity:1;transition:opacity .2s ease .18s,background-color .3s ease,border-color .3s ease} /* arrives as the clip does */
  /* With Adaptive pill on, it follows what is behind it instead, as the iPhone's home indicator does:
     Rust reads the screen beside it (backdrop.rs) and says which backdrop it is on, and the pill takes
     the palette that stands out there. Until Rust answers, and once it is switched off, Theme decides. */
  body[data-behind="dark"] #rest{--pill:#f5f5f7;--rest-edge:#86868b;--rail-run:#1d1d1f;--rail-wait:#B08800;--rail-done:#00A356}
  body[data-behind="light"] #rest{--pill:#000;--rest-edge:#5c5c5c;--rail-run:#ffffff;--rail-wait:#F2FF00;--rail-done:#00FF88}
  /* What the status rail may be coloured in: the same three names the activity arcs already use, so
     the bar flipping has to carry them as well. A single colour cannot serve both bars — the best
     any sRGB colour manages is 4.4:1 against both #000 and #f5f5f7, and the arcs' own #F2FF00 is
     1.01:1 on the light one, which is not a weak signal but no signal. */
  #rest{--rail-run:var(--ink);--rail-wait:var(--watch);--rail-done:var(--ample)}
  body[data-edge="left"] #rest{right:auto;left:0;border-right:1px solid var(--rest-edge);border-left:none;border-radius:0 6px 6px 0}
  body[data-edge="top"] #rest,body[data-edge="bottom"] #rest{right:auto;left:50%;top:auto;translate:-50% 0;width:79px;height:10px;border:1px solid var(--rest-edge)}
  body[data-edge="top"] #rest{top:0;border-top:none;border-radius:0 0 6px 6px}
  body[data-edge="bottom"] #rest{bottom:0;border-bottom:none;border-radius:6px 6px 0 0}
  /* The status rail: the folded bar's own answer to "is anything running?". It takes the bar's inner
     edge, inside the 10 px the bar already occupies — not further in, because the strip 14–26 px out
     is where Rust reads the backdrop from (backdrop.rs) and that read is a real screen capture, so
     anything drawn there would come back as though it were the wallpaper and the bar would spend its
     time chasing its own colour. At opacity 0 while nothing is running, which leaves an idle notch
     exactly what it has always been. */
  #rail{position:absolute;background:var(--rail-c,transparent);pointer-events:none;opacity:0;
    transition:opacity .18s ease;--rail-len:22px;
    left:0;top:0;width:3px;height:var(--rail-len);border-radius:5px 0 0 5px}
  body[data-edge="left"] #rail{left:auto;right:0;border-radius:0 5px 5px 0}
  body[data-edge="top"] #rail{left:0;top:auto;bottom:0;width:var(--rail-len);height:3px;border-radius:0 0 5px 5px}
  body[data-edge="bottom"] #rail{left:0;top:0;width:var(--rail-len);height:3px;border-radius:5px 5px 0 0}
  /* Three states past idle, told apart by shape as well as by colour so the reading survives a bar
     this small and a colour-blind eye: waiting fills the whole rail and pulses — it is the one that
     wants you; running is a short segment sliding along it — it is the one that does not; a run that
     has just finished goes solid green, and that one needs no timer here because the probe stops
     reporting success on its own. All four values `railState` can return are spelled out, idle
     included even though the rule above already says it, so the state space is one closed set here
     and a later change to `#rail` cannot quietly take the idle case with it. steps() on both
     animations for the reason the arcs carry it: a smooth 60 fps animation in a transparent
     always-on-top window drags the desktop compositor down with it. */
  body[data-rail="idle"] #rail{opacity:0}

  .handle.hover .h-disc{opacity:1;transform:scale(1)}
  .handle.hover .h-glyph{opacity:1;transform:rotate(calc(var(--spins,0) * 360deg)) scale(1)}
  /* Carrying: the disc goes dashed and the hand stops turning — it is being held now, not offered */
  #move.armed .h-disc{border:2px dashed var(--ink-2);background:var(--armed)}

  body[data-edge="left"] #move{--arc:90deg}
  body[data-edge="top"] #move{--arc:270deg}
  @media (prefers-reduced-motion: reduce){.handle > *{transition:none}}
</style>

// "Is it working?" per provider, from the activity probe. Returns running | attention | complete |
// idle — the four states upstream's `ActivitySummary` has, in its precedence: anything blocked on you
// outranks anything merely busy, and a run that has just finished is worth drawing before the cell
// goes quiet again.
//
// WorkBuddy and the DeepSeek Harness are both covered: the first is read from the tail of its
// transcripts the way Codex is, the second from the `turn/end` the harness writes from a finally,
// which also makes "waiting on your approval" a fact rather than an inference. Which of the four it
// can show is a separate question from being seen at all, and the probe is the only thing that
// knows: WorkBuddy stops at `busy`, because its transcripts carry no record that would settle either
// of the other two. z.ai and OpenCode are still unseen, so their cells stay idle and draw no arc.
function workState(id){
  const acts=activity.filter(a=>a.provider===id);
  if(acts.some(a=>a.state==='waiting')) return 'attention';
  if(acts.some(a=>a.state==='busy')) return 'running';
  if(acts.some(a=>a.state==='success')) return 'complete';
  return 'idle';
}
// The folded bar carries the same three states, folded down into one reading: it is 10 px wide and
// has no room to say which provider it means, only that something is happening. The precedence is
// `workState`'s own, and it matters most here — "busy" and "waiting on you" are exactly the two
// things you fold the notch to stop looking at, so letting the bar draw them the same is how the one
// that wants an answer gets missed. Read over the providers actually on screen, so the bar can never
// light up for a cell the pill does not have. A finish is worth a glance, not an interruption, so it
// comes last.
function railState(){
  const ws=providers().map(p=>workState(p.base));
  if(ws.some(w=>w==='attention')) return 'wait';
  if(ws.some(w=>w==='running')) return 'run';
  if(ws.some(w=>w==='complete')) return 'done';
  return 'idle';
}
function glyphHtml(p,small){

  if(g&&g.url) return `<img class="${g.kind}" src="${g.url}" alt="${p.name}"${small?' style="width:16px;height:16px;border-radius:4px"':''}>`;
  return small?'':p.glyph; // fallback letter
}

// Same status vocabulary as the provider readings: ok | stale | none | error. `none` means no

function slotFor(id){
  if(!Array.isArray(notchSlots)) return null;

// are no per-account headings to split on the way Claude Code's windows had.
function workbuddyCells(){
  if(usage.status==='absent') return [];
  return [{id:'workbuddy',base:'workbuddy',name:'WorkBuddy',glyph:'W',snap:usage}];
}
function providers(){
  const list=workbuddyCells();
  if(codexSnap.status!=='absent') list.push({id:'codex',base:'codex',name:'Codex',glyph:'Cx',snap:codexSnap});
  if(glmSnap.status!=='absent') list.push({id:'glm',base:'glm',name:'z.ai',glyph:'Z.ai',snap:glmSnap});
  if(opencodeSnap.status!=='absent') list.push({id:'opencode',base:'opencode',name:'OpenCode',glyph:'OC',snap:opencodeSnap});
  if(cursorSnap.status!=='absent') list.push({id:'cursor',base:'cursor',name:'Cursor',glyph:'Cu',snap:cursorSnap});
  if(dshSnap.status!=='absent') list.push({id:'dsh',base:'dsh',name:'DeepSeek Harness',glyph:'DS',snap:dshSnap});
  if(agSnap.status!=='absent') list.push({id:'gemini',base:'gemini',name:'Antigravity',glyph:'Ag',snap:agSnap});
  if(Array.isArray(notchSlots)&&notchSlots.length){
    const picked=list.filter(p=>!!slotFor(p.base));
    // Never leave the notch with nothing in it: an empty result means the choice no longer matches
    // any available provider, so fall back to showing everything rather than an empty pill.
    if(picked.length) return picked;
  }
  return list;
}

// The workbench's three numbers. They are counts, not gauges: nothing publishes a denominator, so
// each ring frames the number instead of filling an arc, and colour carries the whole message —
// dim at zero, white for something waiting, red for something already late, amber for something
// about to be. Zero is never hidden: "0 overdue" is an answer, and often the reason to look.
function brainCells(){
  if(!brain||brain.status==='none') return [];
  const live=brain.status!=='error';
  return [
    {id:'due', label:'Todos', n:brain.due, tone:INK},
    {id:'over', label:'Overdue', n:brain.over, tone:CRIT},
    {id:'soon', label:'Due soon', n:brain.soon, tone:WATCH},
  ].map(b=>{
    const count=(b.n&&typeof b.n.count==='number')?b.n.count:0;
    const text=live?compactCount(count):'\u2014';
    return Object.assign(b,{count,text,color:live&&count>0?b.tone:DIM});
  });
}
// Antigravity's "Notch reads" and "Model data", as in the Mac app; chosen in settings
let agPrefs={limit:'automatic',model:'gemini'};
// Where the weekly limit's own ring goes, from settings: 'off', 'inside' or 'outside'
let weeklyRing='off';
// The tightest metered window, ties going to the lower id so the choice never flickers
function tightestOf(ws){
  return ws.filter(w=>w.count==null).reduce((a,b)=>!a||b.used>a.used||(b.used===a.used&&b.id<a.id)?b:a,null);
}
function laneFamily(w){ const id=w.id.toLowerCase(); return id.startsWith('gemini')?'gemini':(id.startsWith('3p')||id.startsWith('claude'))?'3p':''; }
function laneIs(w,limit){
  const t=(w.id+' '+w.label).toLowerCase();
  return limit==='weekly'?t.includes('weekly'):['5h','5-hour','five hour','five-hour','hourly','session'].some(k=>t.includes(k));
}
// The window a provider's ring shows: the same rule as ring_window in main.rs, which draws the tray
// BEGIN TESTABLE HEADLINE SELECTOR
function headlineOf(snap,id){
  const ws=snap.windows; if(!ws.length) return null;
  const byId=x=>ws.find(w=>w.id===x)||null;
  if(id==='workbuddy') return byId('credits')||byId('today'); // tokens lead once the balance is sealed
  if(id==='codex') return byId('primary');
  if(id==='cursor') return byId('included')||byId('api');
  if(id==='dsh') return byId('today')||ws[0]; // counts, not fractions — the ring draws the track only
  if(id==='glm') return byId('session');
  if(id==='opencode') return byId('rolling');
  const fam=ws.filter(w=>laneFamily(w)===agPrefs.model), lanes=fam.length?fam:ws;
  if(agPrefs.limit!=='automatic'){ const w=tightestOf(lanes.filter(w=>laneIs(w,agPrefs.limit))); if(w) return w; }
  return tightestOf(lanes.filter(w=>w.used<1))||tightestOf(lanes)||lanes[0];
}
// END TESTABLE HEADLINE SELECTOR
// The weekly window each provider reports, or null where there is none: Codex calls its second
// window secondary, GLM and OpenCode name one weekly, and Antigravity has one per model family.
// Cursor has none, WorkBuddy reports a balance and running token counts, and DeepSeek Harness's
// tokens are counted over their own spans rather than against a weekly allowance.
// BEGIN TESTABLE WEEKLY SELECTOR
function weeklyOf(snap,id){
  // A window with no denominator has no weekly reading to give, so it is not a candidate here either.
  const ws=snap.windows.filter(w=>w.count==null&&!w.unmetered); if(!ws.length) return null;
  const byId=x=>ws.find(w=>w.id===x)||null;
  if(id==='workbuddy') return null; // a balance and running token counts, never a weekly window
  if(id==='codex') return byId('secondary');
  if(id==='cursor') return null;
  if(id==='dsh') return null; // count windows carry no denominator
  if(id==='glm') return byId('weekly');
  if(id==='opencode') return byId('weekly');
  const fam=ws.filter(w=>laneFamily(w)===agPrefs.model), lanes=fam.length?fam:ws;
  return tightestOf(lanes.filter(w=>laneIs(w,'weekly')));
}
// END TESTABLE WEEKLY SELECTOR
// 15 minutes, the Mac's `UsageStore.staleAfter`. At 5 a reading went grey between two polls of a
// provider that is answering perfectly well, which made "stale" mean "recently fetched" rather than
// "old enough not to trust". A provider that knows its own reading is stale still says so in status.
function staleOf(snap){ if(snap.status==='stale') return true; return snap.fetched_at>0 && (Date.now()-snap.fetched_at)>15*60*1000; }
// The page's own state from Rust: the resolved language and the clock format (see PageState in main.rs)
let stateSnap={lang:'',lang_resolved:'',clock_24h:false};

function svgArc(r,frac,color,width,extra=''){
  // Nothing at all at zero: a zero-length dash still paints a dot once the caps are round, where the
  // Mac's `trim(from: 0, to: 0)` draws nothing. A reading small enough that its two caps meet does
  // draw as a dot, on both platforms — `ProviderRing.sweep` has no floor. Upstream #260 argues that
  // is wrong, for the local model's arc; if it lands, the same floor belongs here.
  if(!(frac>0)) return '';
  const C=2*Math.PI*r;
  return `<circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="${width}"
    stroke-dasharray="${(C*frac).toFixed(2)} ${C.toFixed(2)}" stroke-linecap="round"
    transform="rotate(-90 28 28)" ${extra}/>`;
}
// A full ring breathing in place. Waiting and "just finished" share the shape and differ only in
// colour: amber is the one state that wants something from you, and green is the one state that
// wants nothing at all. `arc-pulse` is the same 6-step animation the amber one has always used.
const pulseArc=(r,color)=>`<g class="arc-pulse"><circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="2.5"/></g>`;

function renderRing(){
  const ps=providers(), bs=brainCells();
  // Rebuild the DOM only when the structure changes (never swap the element under the cursor).
  // The business cells carry `data-p` as well, prefixed `b:`: the hover hit-test and the card's
  // tail both find their target through that attribute, so neither has to learn about them.
  const want=ps.map(p=>p.id+':'+(glyphs[p.base]?glyphs[p.base].kind:'-')).join(',')
    +'|'+bs.map(b=>b.id).join(',');
  if(pill.dataset.cells!==want){
    pill.innerHTML=ps.map((p,i)=>`<div class="cell" data-p="${p.id}" style="--i:${i}">
      <div class="ringwrap"><svg class="ring" viewBox="0 0 56 56"></svg><svg class="reading" viewBox="0 0 56 56"></svg><svg class="activity" viewBox="0 0 56 56"></svg><div class="glyph ${(!glyphs[p.base]&&p.glyph.length>1)?'small':''}">${glyphHtml(p)}</div></div>
      <div class="pct">—</div></div>`).join('')
      +(bs.length?`<div class="sep"></div>`:'')
      +bs.map((b,i)=>`<div class="cell" data-p="b:${b.id}" style="--i:${ps.length+i}">
        <div class="ringwrap"><svg class="ring" viewBox="0 0 56 56"></svg><div class="bnum"></div></div>
        <div class="pct"></div></div>`).join('');
    pill.dataset.cells=want;
  }
  for(const p of ps){
    const cell=pill.querySelector(`.cell[data-p="${p.id}"]`); if(!cell) continue;
    const svg=cell.querySelector('svg.ring'), reading=cell.querySelector('svg.reading'), activity=cell.querySelector('svg.activity'), pct=cell.querySelector('.pct'), glyph=cell.querySelector('.glyph'), wrap=cell.querySelector('.ringwrap');
    const h=headlineOf(p.snap,p.base);
    let inner=`<circle cx="28" cy="28" r="22" fill="${HOLE}"/><circle cx="28" cy="28" r="25" fill="none" stroke="${TRACK}" stroke-width="5"/>`;
    wrap.classList.toggle('pressed',!!refreshing[p.id]);
    // A count window and an unmetered one both leave the arc undrawn: the first has no denominator
    // published, the second has none at all. Spelled out rather than left to `used` being zero, so a
    // later change that gives such a window a value cannot quietly start drawing a ring from it.
    reading.innerHTML=h && h.count==null && !h.unmetered?svgArc(25,Math.min(h.used,1),tone(h.used),5):'';
    if(weeklyRing!=='off'){ // the week, thinner and at its own radius, in its own colour: a session at 12% beside a week at 91% is the case this exists for
      const wk=weeklyOf(p.snap,p.base);
      // Inside, it shares the gap with the working indicator, so it stands down while that is showing
      const taken=weeklyRing==='inside'&&workState(p.base)!=='idle';
      if(wk&&(!h||wk.id!==h.id)&&!taken){
        const r=weeklyRing==='inside'?16:31;
        inner+=`<circle cx="28" cy="28" r="${r}" fill="none" stroke="${TRACK}" stroke-width="2.4" opacity="0.7"/>`
          +svgArc(r,Math.min(wk.used,1),tone(wk.used),2.4,'opacity="0.85"');
      }
    }
    svg.innerHTML=inner;
    { // thin inner arc: spinning white = working, amber pulse = waiting on you, green pulse = a run
      // that has just finished. One animation for every provider, whatever the source of the state
      // behind it, and the same three the Mac draws from `ActivityArc`.
      // Its own layer, so a stale reading can dim around it without dimming it: see `.ringwrap.stale`
      const ws=workState(p.base);
      if(ws==='running') activity.innerHTML=`<g class="arc-spin">${svgArc(19,0.28,INK,2.5)}</g>`;
      else if(ws==='attention') activity.innerHTML=pulseArc(19,WATCH);
      else if(ws==='complete') activity.innerHTML=pulseArc(19,AMPLE);
      else activity.innerHTML='';
    }
    if(p.snap.status==='needsAuth'||p.snap.status==='none') pct.textContent='—';
    else if(h && h.count!=null) pct.textContent='~'+compactCount(h.count);
    // A balance with no denominator: the figure belongs in the pill, the percentage does not exist.
    else if(h && h.unmetered) pct.textContent=h.remaining!=null?compactMoney(h.remaining,h.unit):'—';
    else if(h) pct.textContent=(h.derived?'~':'')+pctText(h.used)+'%';
    else pct.textContent=p.snap.windows.length?'—':'…'; // its declared window is missing: a dash, not a wait
    glyph.classList.toggle('dim', !!(h && h.used>=1));
    wrap.classList.toggle('stale', staleOf(p.snap));
  }
  // The business cells: a frame around a number and the word under it. Drawn after the providers so
  // the hairline between the two groups is never part of a cell's own box, and so a provider
  // appearing cannot shift what the business rows are showing.
  for(const b of bs){
    const cell=pill.querySelector(`.cell[data-p="b:${b.id}"]`); if(!cell) continue;
    const svg=cell.querySelector('svg.ring'), num=cell.querySelector('.bnum'), label=cell.querySelector('.pct');
    // A failed read with nothing kept leaves the frame empty but present: the ring going away would
    // say the workbench is not configured, which is a different thing from being unreachable.
    svg.innerHTML=`<circle cx="28" cy="28" r="22" fill="${HOLE}"/>`
      +`<circle cx="28" cy="28" r="25" fill="none" stroke="${b.count>0?b.color:TRACK}" stroke-width="5" opacity="${brain.status==='error'?.35:1}"/>`;
    num.textContent=b.text;
    num.className='bnum'+(b.text.length>3?' w3':b.text.length>2?' w2':'');
    num.style.color=b.color;
    label.textContent=textCopy(b.label);
    label.style.color=b.color;
    cell.classList.toggle('stale',brain.status==='stale');
  }
  // The folded bar's own reading, off the same data and the same precedence. Written only when it
  // changes, so a render that alters nothing touches nothing.
  const rs=railState();
  if(document.body.dataset.rail!==rs) document.body.dataset.rail=rs;
  reportHot(); // a provider appearing or leaving resizes the pill
}

function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now();
  if(diff<=0) return ui().resetting;
  const min=Math.round(diff/60000); // rounded before the test, so 59m40s never reads "Resets in 60 min"
  if(min<60) return ui().resetsIn(Math.max(1,min));
  const d=new Date(ms), locale=ui().locale;
  // A weekday only names a day in the coming week: a Codex monthly reset 26 days out read as this Monday
  if(daysApart(Date.now(),ms)>=7) return ui().resetsDate(d.toLocaleDateString(locale,{month:'short',day:'numeric'}));
  const t=d.toLocaleTimeString(locale,{hour:'numeric',minute:'2-digit',hourCycle:stateSnap.clock_24h?'h23':'h12'});
  if(diff<24*60*60*1000) return ui().resetsAt(t);
  return ui().resetsOn(d.toLocaleDateString(locale,{weekday:'short'}),t);
}
// Calendar days rather than 24-hour blocks, so a clock change cannot move the answer
function daysApart(from,to){
  const day=ms=>{const d=new Date(ms); return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();};
  return Math.round((day(to)-day(from))/86400000);
}

function ago(ms){
  const m=Math.round((Date.now()-ms)/60000);
  return ui().ago(m);
}

// The card is clipped, not scrolled, so rows past this would push its title off the top; the rest are counted, as on the Mac
const SESSION_ROWS=5;
function moreRow(n){ return n>0?`<div class="s-more">${ui().andMore(n)}</div>`:''; }

let hoverId='workbuddy';
function renderCard(){
  const c=document.getElementById('card');
  // A business cell is not a provider and has no windows: hovering one opens a card about the
  // workbench itself, decided before any provider is considered.
  if(hoverId&&hoverId.indexOf('b:')===0){ renderBrainCard(c,hoverId.slice(2)); return; }
  const list=providers();
  // With no provider installed at all there is nothing to say: leave the card closed rather than
  // open it on a blank. (WorkBuddy may be absent like any other provider, so this is reachable.)
  const p=list.find(x=>x.id===hoverId)||list[0];
  if(!p){ card.classList.remove('show'); return; }
  const snap=p.snap;
  const headIcon=glyphHtml(p,true);
  let html=`<div class="c-head">${headIcon}<span class="c-title">${esc(ui().title(p.name))}</span></div>`;
  if(staleOf(snap)&&snap.fetched_at) html+=`<div class="c-sub">${ui().updated(ago(snap.fetched_at))}</div>`;
  if(snap.status==='needsAuth'){
    const who={workbuddy:'Sign in to WorkBuddy to see usage.',cursor:'Sign in to Cursor to see usage.',codex:'Sign in to Codex to see usage.',dsh:'DeepSeek Harness has not run here yet.',opencode:'Run opencode auth login to see usage.',gemini:'Sign in to Antigravity to see usage.'}[p.base]||'';
    html+=`<div class="c-note">${textCopy(who)}<br>${esc(textCopy(snap.note||''))}</div>`;
  }else if(!snap.windows.length){
    html+=`<div class="c-note">${esc(textCopy(snap.note||'Waiting for first reading…'))}</div>`;
  }else{
    // Windows that share a group (Antigravity's model families) sit in one box under its name, as on the Mac
    let group=null;
    for(const w of snap.windows){
      if((w.group||null)!==group){
        if(group) html+=`</div>`;
        group=w.group||null;
        if(group) html+=`<div class="g-head">${esc(textCopy(group))}</div><div class="g-box">`;
      }
      if(w.count!=null){
        // A count window has no denominator: `unit` says what is being counted — Antigravity counts
        // requests, WorkBuddy and DeepSeek Harness count tokens. The span belongs to the label above
        // ("Today", "Last 7 days"), so the row names only the quantity. The money rides on the same
        // line rather than claiming a row of its own: it is the same measurement in another unit.
        html+=`<div class="win"><div class="w-row"><span class="w-label">${esc(textCopy(w.label))}</span></div>
          <div class="w-used">${countCopy(w)}${costCopy(w,snap)}</div></div>`;
        continue;
      }
      // A window with a remainder but no denominator — a money balance with no top-up figure to
      // divide by. It gets no track and no percentage: the ring would be a fraction of nothing, and a
      // 0 % arc over a full account is a claim rather than a blank. The remainder is the reading.
      if(w.unmetered){
        html+=`<div class="win"><div class="w-row"><span class="w-label">${esc(textCopy(w.label))}</span></div>
          ${leftCopy(w)}</div>`;
        continue;
      }
      html+=`<div class="win">
        <div class="w-row"><span class="w-label">${esc(textCopy(w.label))}</span><span class="w-reset">${resetCopy(w.resets_at)}</span></div>
        <div class="w-track"><div class="w-fill" style="width:${(Math.min(w.used,1)*100).toFixed(0)}%;background:${tone(w.used)}"></div></div>
        <div class="w-used">${esc(usedCopy(w))}</div>
        ${leftCopy(w)}
      </div>`;
    }
    if(group) html+=`</div>`;
    // The money, when this provider's history can be priced. A block of its own rather than more rows
    // under the windows: everything above is what the vendor reported, and this is what this machine
    // worked out from it, and the card should not blur the two.
    if(snap.cost){
      const parts=(snap.cost.parts||[]).filter(p=>p.tokens>0);
      const unpriced=snap.cost.unpriced||[];
      if(parts.length||unpriced.length){
        // Only the priced kinds are summed, so the total always equals the rows printed above it.
        const total=parts.reduce((sum,p)=>sum+Number(p.cost||0),0);
        html+=`<div class="c-cost"><div class="c-cost-head">${esc(textCopy('Estimated spend'))}</div>`;
        for(const part of parts){
          html+=`<div class="c-cost-row"><span>${esc(textCopy(part.label))}</span><span class="c-cost-num">${money(part.cost,snap.cost.currency)}</span></div>`;
        }
        html+=`<div class="c-cost-row total"><span>${esc(textCopy(snap.cost.window))}</span><span class="c-cost-num">${money(total,snap.cost.currency)}</span></div>`;
        html+=`<div class="c-cost-note">${esc(textCopy(snap.cost.rate_note))}</div>`;
        // A model the rate table does not know is named rather than priced off someone else's card:
        // its tokens are in the counts above and deliberately absent from the money below.
        if(unpriced.length){
          html+=`<div class="c-cost-note">${esc(textCopy('Not priced: '+unpriced.join(', ')))}</div>`;
        }
        html+=`</div>`;
      }
    }
    if(snap.note) html+=`<div class="c-note">${esc(textCopy(snap.note))}</div>`;
  }
  // Detected activity rows (Cursor and the harness report state; Codex, WorkBuddy and Antigravity
  // are inferred from recent writes). Ordered by what it asks of you and then by recency — waiting,
  // then working, then a run that just finished — so what gets cut by the row limit matters least.
  // The rank matches the probe's own sort, which decides the same order for the ring above.
  const RANK={waiting:0,busy:1,success:2};
  const acts=activity.filter(a=>a.provider===p.base)
    .sort((a,b)=>(RANK[a.state]??3)-(RANK[b.state]??3)||b.since-a.since);
  if(acts.length){
    html+=`<div class="c-sessions">`;
    for(const a of acts.slice(0,SESSION_ROWS)){
      const col=a.state==='waiting'?WATCH : a.state==='success'?AMPLE : INK;
      html+=`<div class="s-row"><span class="s-dot" style="background:${col}"></span>${esc(a.name)}<span style="color:#808080;margin-left:auto">${esc(textCopy(a.detail))}</span></div>`;
    }
    html+=moreRow(acts.length-SESSION_ROWS)+`</div>`;
  }
  c.innerHTML=html;
  placeCard();
}
// The workbench's card. Unlike every provider card, this one can be showing numbers from hours ago:
// the workbench only rewrites its snapshot while its page is open, so the age of the reading is part
// of the answer rather than a footnote, and a stale one says so before it says anything else.
//
// Details are whatever the workbench published. It trims each list to ten entries, so a list that
// was trimmed is counted out loud instead of letting ten look like all of them.
const BRAIN_ROWS=10;
function renderBrainCard(c,id){
  const b=brainCells().find(x=>x.id===id);
  if(!b){ c.classList.remove('show'); return; }
  const rows=(b.n&&Array.isArray(b.n.items))?b.n.items:[];
  let html=`<div class="c-head"><span class="c-title">${esc(textCopy(b.label))}</span>`
    +`<span class="c-count" style="color:${b.color}">${esc(b.text)}</span></div>`;
  if(brain.status==='stale') html+=`<div class="c-sub">${ui().updated(ago(brain.read_at))} — ${esc(textCopy(brain.note||'showing the last reading'))}</div>`;
  else if(brain.status==='error') html+=`<div class="c-sub">${esc(textCopy(brain.note||'could not reach the workbench'))}</div>`;
  else if(brain.at) html+=`<div class="c-sub">${ui().updated(ago(brain.at))}</div>`;
  if(!rows.length){
    // Two different nothings, and the card must not confuse them: an empty list on a good reading is
    // "nothing here", while an empty list on an old snapshot means the page has not published them yet.
    const why=(brain.status==='ok'&&!b.count)?'Nothing here.'
      :'No details in this snapshot — open the workbench once so it publishes them.';
    html+=`<div class="c-note">${esc(textCopy(why))}</div>`;
  }else{
    html+=`<div class="c-sessions">`;
    for(const it of rows.slice(0,BRAIN_ROWS)){
      const days=(typeof it.days==='number')?it.days:null;
      const late=days!=null&&days<0;
      const near=days!=null&&days>=0&&days<=2;
      const meta=[it.date,it.tag].filter(Boolean).join(' · ');
      html+=`<div class="s-row"><span class="s-dot" style="background:${late?CRIT:near?WATCH:DIM}"></span>`
        +`<span class="s-name">${esc(it.title)}</span>`
        +`<span class="s-meta${late?' late':''}">${esc(meta)}</span></div>`;
    }
    if(b.n&&b.n.cut) html+=moreRow(b.count-rows.length); // the workbench trimmed the list, say by how much
    html+=`</div>`;
  }
  c.innerHTML=html;
  placeCard();
}
// The card follows the hovered cell: centred on it along the pill (kept inside the window), tail pointing at it.
// On the upright edges that means matching its vertical centre; on the flat ones, its horizontal centre,
// and the card is pushed clear of a pill whose thickness follows the cells it holds.
function placeCard(){
  const cell=pill.querySelector(`.cell[data-p="${hoverId}"]`)||pill;
  const cr=cell.getBoundingClientRect();
  // The point sits on the ring, not the cell, which includes the label below it
  const rr=(cell.querySelector('.ringwrap')||cell).getBoundingClientRect();
  card.style.transform='none';
  if(edgeIsVertical()){
    const cy=cr.top+cr.height/2;
    const H=innerHeight, ch=card.offsetHeight||0;
    let top=Math.round(cy-ch/2); top=Math.max(8+insets[0],Math.min(top,H-insets[2]-ch-8));
    card.style.top=top+'px'; card.style.left='';
    const ry=rr.top+rr.height/2;
    const th=tail.offsetHeight||36, ty=Math.max(top+16+th/2,Math.min(top+ch-16-th/2,ry));
    tail.style.top=Math.round(ty-th/2)+'px'; tail.style.left='';
  }else{
    const pr=pill.getBoundingClientRect();
    const cx=cr.left+cr.width/2;
    const W=innerWidth, cw=card.offsetWidth||0, ch=card.offsetHeight||0;
    let left=Math.round(cx-cw/2); left=Math.max(8+insets[3],Math.min(left,W-insets[1]-cw-8));
    card.style.left=left+'px';
    const rx=rr.left+rr.width/2;
    const tw=tail.offsetWidth||36, tx=Math.max(left+16+tw/2,Math.min(left+cw-16-tw/2,rx));
    tail.style.left=Math.round(tx-tw/2)+'px';
    // 30 px of clear gap, the same the upright edges leave, with the tail spanning it 1 px under the pill
    if(notchEdge==='top'){ card.style.top=Math.round(pr.bottom+30)+'px'; tail.style.top=Math.round(pr.bottom-1)+'px'; }
    else{ card.style.top=Math.round(pr.top-30-ch)+'px'; tail.style.top=Math.round(pr.top-31)+'px'; }
  }
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

/* Hover: stays expanded while either the pill or the card is under the cursor; collapses after a 250 ms grace period (upstream motion rule) */
const card=document.getElementById('card'), pill=document.getElementById('pill'), tail=document.getElementById('tail');
let hideTimer=null;
function showCard(){clearTimeout(hideTimer);card.classList.add('show');renderCard();armWatchdog();refreshClock();} // show first, then render: placeCard needs offsetHeight
// Nothing is broadcast when the Windows clock format changes, so ask again each time the card opens
function refreshClock(){
  invoke('get_state').then(s=>{
    if(!s||s.clock_24h===stateSnap.clock_24h) return;
    stateSnap.clock_24h=s.clock_24h;
    if(card.classList.contains('show')) renderCard();
  }).catch(()=>{});
}
function hideCard(){card.classList.remove('show');reportHot();}
function scheduleHide(){clearTimeout(hideTimer);hideTimer=setTimeout(hideCard,250);}
// ===== Diagnostics + geometry =====
function jslog(m){invoke('log_js',{msg:String(m)}).catch(()=>{});}
function callq(cmd,args){ // invoke with visible failure: any command error is reported on screen (a silent .catch used to swallow them)
  return invoke(cmd,args).catch(e=>{notice(cmd+' failed: '+(e&&e.message||e));throw e;});
}
// Hot rectangles are reported in physical pixels (multiplied by this page's real DPR), so the Rust side does no conversion — WebView2's DPR and the window scale can disagree
function rectOf(el){const r=el.getBoundingClientRect(),k=window.devicePixelRatio||1;return [r.left*k,r.top*k,r.width*k,r.height*k];}
/* Rust gates click-through on these, so they are reported whenever the pill or card moves, not only
   when the card opens: a stale pill rectangle is a pill that cannot be clicked. */
function reportHot(){
  if(folded){ callq('set_hot',{rects:[wakeRect()],expanded:false,probe:probeRect()}).catch(()=>{}); return; }
  const open=card.classList.contains('show');
  const rects=open?[rectOf(pill),rectOf(tail),rectOf(card)]:[rectOf(pill)];
  if(placeHandles()){ rects.push(rectOf(orb)); if(showMove) rects.push(rectOf(moveHandle)); }
  callq('set_hot',{rects,expanded:open}).catch(()=>{});
}
/* What wakes the folded notch: the resting pill, as long along the edge as the pill and deepened into
   the screen by the Mac's pillHotZone — Design.px(90), 34 here — because the pill is small and the
   place that opens it should not be (NotchViewModel.wakeLength and wakeDepth). */
const WAKE_BAND=34;
function wakeRect(){
  const r=document.getElementById('rest').getBoundingClientRect(), k=window.devicePixelRatio||1;
  const b=WAKE_BAND*(parseFloat(document.documentElement.style.zoom)||1); // rects come back zoomed
  let x=r.left,y=r.top,w=r.width,h=r.height;
  if(notchEdge==='left') w+=b; else if(notchEdge==='top') h+=b; else if(notchEdge==='bottom'){ y-=b; h+=b; } else { x-=b; w+=b; }
  return [x*k,y*k,w*k,h*k];
}
/* The strip of screen Rust reads to choose the resting pill's colour: beside the pill, on the side away
   from the edge, where nothing is drawn while folded. */
const PROBE_GAP=4, PROBE_DEPTH=12;
function probeRect(){
  const r=document.getElementById('rest').getBoundingClientRect(), k=window.devicePixelRatio||1;
  const z=parseFloat(document.documentElement.style.zoom)||1, g=PROBE_GAP*z, d=PROBE_DEPTH*z;
  let x=r.left-g-d,y=r.top,w=d,h=r.height;
  if(notchEdge==='left') x=r.right+g;
  else if(notchEdge==='top'){ x=r.left; y=r.bottom+g; w=r.width; h=d; }
  else if(notchEdge==='bottom'){ x=r.left; y=r.top-g-d; w=r.width; h=d; }
  return [x*k,y*k,w*k,h*k];
}
function armWatchdog(){
  requestAnimationFrame(reportHot); // wait one frame so renderCard's new content is laid out before measuring
}
// Viewport fit (pure front-end fallback, independent of Rust): Rust sizes and zooms the window so this
// page is as wide as the design, so if the CSS viewport is not that wide the WebView's DPR disagrees
// with the monitor; CSS zoom pulls the layout back to the design size.
// The design width is the window's, and the window is not the same shape on every edge — see
// `notch_window_size` in main.rs: NOTCH_W upright, NOTCH_LONG lying flat. Dividing by 360 on a
// flat edge read the wider window as a DPR error and zoomed the whole notch by 520/360. Either number
// left behind when the window changes width does the same thing, so a test in main.rs pins both.
const DESIGN_W_UPRIGHT=360, DESIGN_W_FLAT=900;
function designWidth(){ return edgeIsVertical()?DESIGN_W_UPRIGHT:DESIGN_W_FLAT; }
function fitZoom(){
  const z=innerWidth/designWidth();
  document.documentElement.style.zoom=(Math.abs(z-1)>0.02)?String(z):'';
  return z;
}
// `settled` only from the end of a burst of resizes, which is what a landing waits for (land_on_another_screen)
function reportDpr(settled){
  const z=fitZoom();
  jslog(`dpr=${window.devicePixelRatio} inner=${innerWidth}x${innerHeight} cssZoom=${z.toFixed(3)}`);
  callq('report_dpr',{dpr:window.devicePixelRatio||1,w:innerWidth,h:innerHeight,settled:settled===true}).catch(()=>{});
}
// Not measured yet: the width to measure against depends on the edge, and only Rust knows it. The
// ask is at the bottom of this file and answers in a round trip; measuring first would zoom a flat
// window by 520/360 for that moment.
window.addEventListener('resize',()=>{clearTimeout(window._dprT);window._dprT=setTimeout(()=>{reportDpr(true);reportHot();},120);});
matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change',()=>reportDpr());
// A landing on a screen at another scale: empty the page, which leaves the transparent window
// invisible while it is resized and re-zoomed, and say so once that has painted — hiding the window
// itself would pause the page, and the re-zoom would then happen in plain view
listen('notch_landing',()=>{
  document.documentElement.style.visibility='hidden';
  requestAnimationFrame(()=>requestAnimationFrame(()=>invoke('notch_hidden').catch(()=>{})));
}).catch(()=>{});
listen('notch_reveal',()=>{ document.documentElement.style.visibility=''; }).catch(()=>{});

/* Collapse test: no trust in element-level mouseenter/mouseleave/e.target at all —
   pure geometry: is the cursor (clientX/Y) inside pill rect ∪ card rect ∪ their bounding box?
   Leaving the window: document mouseout (relatedTarget=null) plus the Rust watchdog (system cursor) as a second line. */
function inRect(x,y,r,pad){return x>=r.left-pad&&y>=r.top-pad&&x<r.right+pad&&y<r.bottom+pad;}
function cellAt(x,y){
  for(const el of pill.querySelectorAll('.cell')){ if(inRect(x,y,el.getBoundingClientRect(),6)) return el.dataset.p; }
  return null;
}
function pointerInHot(x,y){
  const p=pill.getBoundingClientRect();
  if(inRect(x,y,p,4))return true;
  if(!card.classList.contains('show'))return false;
  const c=card.getBoundingClientRect();
  if(inRect(x,y,c,4))return true;
  const u={left:Math.min(p.left,c.left),top:Math.min(p.top,c.top),right:Math.max(p.right,c.right),bottom:Math.max(p.bottom,c.bottom)};
  return inRect(x,y,u,0);
}
let hideLogged=0;
document.addEventListener('mousemove',e=>{
  // Folded, the page is sent events only over the pill, so any movement at all is the pointer reaching it
  if(folded){ pointerIn=true; unfold(); }
  if(dragging)return; // no card while dragging
  if(carrying) return; // the notch is in hand; the card would only be in the way
  setHovered(onHandle(e.clientX,e.clientY));
  if(hovered){ if(card.classList.contains('show')){ clearTimeout(hideTimer); hideCard(); } return; }
  const hot=pointerInHot(e.clientX,e.clientY);
  if(hot){
    clearTimeout(hideTimer);
    const id=cellAt(e.clientX,e.clientY);
    if(id&&id!==hoverId){ hoverId=id; if(card.classList.contains('show')){ renderCard(); armWatchdog(); } }
    if(!card.classList.contains('show')) showCard();
  }
  else if(card.classList.contains('show')){ if(hideLogged++<5) jslog(`mousemove left the hot area -> collapse at ${e.clientX},${e.clientY}`); scheduleHide(); }
});
document.addEventListener('mouseout',e=>{ // relatedTarget null = the cursor left the page
  if(!e.relatedTarget && card.classList.contains('show')){ if(hideLogged++<5) jslog('mouseout left the page -> collapse'); scheduleHide(); }
});
listen('pointer_left',()=>{clearTimeout(hideTimer);hideCard();}).catch(()=>{});
// Card content changes change its height -> report the hot rectangles again
listen('workbuddy',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
listen('state',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
/* The pill can be dragged up and down the right edge. Press and move more than 4 px = drag (handed to Rust,
   which follows the system cursor; the card is collapsed first); release without moving = click (refetches that ring). */
let press=null, dragging=false;
/* As on the Mac, a clicked ring presses in until its reading lands, and the reading turns once.
   Each provider's reading listener below calls settle() for its ring; PRESS_MAX is only the fallback.
   Rust answers false when no reading is coming. */
const PRESS_MIN=380, PRESS_MAX=6000;
const refreshing={};
function refreshRing(id){
  if(refreshing[id]) return;
  refreshing[id]={at:Date.now(),timer:setTimeout(()=>settle(id),PRESS_MAX)};
  renderRing();
  turnReading(id);
  // The cell id addresses the DOM, the provider id addresses Rust. They are the same string today,
  // but the mapping is kept so a cell that ever needs a distinct DOM id still reaches Rust.
  const provider=(providers().find(p=>p.id===id)||{}).base||id;
  invoke('refresh_ring',{provider}).then(coming=>{if(!coming)settle(id);}).catch(()=>settle(id));
}
// The reading has a layer of its own that renders never replace, turned as a whole element so the
// compositor can run it; it finishes its turn whenever the press lets go
function turnReading(id){
  const el=pill.querySelector(`.cell[data-p="${id}"] svg.reading`);
  if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(el.getAnimations().some(a=>a.playState==='running')) return;
  el.animate([{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{duration:950,easing:'cubic-bezier(.32,0,.14,1)'});
}
function settle(id){
  const r=refreshing[id]; if(!r) return;
  clearTimeout(r.timer);
  const wait=r.at+PRESS_MIN-Date.now();
  if(wait>0){ r.timer=setTimeout(()=>settle(id),wait); return; }
  delete refreshing[id];
  renderRing();
}
// Alt+drag, the Mac's ⌥-drag. Without Alt a press on the pill is only ever a click — a ring
// refreshes (#244) — so one that slips can no longer carry the notch off (#251).
pill.addEventListener('mousedown',e=>{ if(e.button!==0||folded)return; press={x:e.clientX,y:e.clientY,id:cellAt(e.clientX,e.clientY)||hoverId,alt:e.altKey}; });
document.addEventListener('mousemove',e=>{
  if(!press||dragging||!press.alt)return;
  if(Math.abs(e.clientY-press.y)>4||Math.abs(e.clientX-press.x)>4){
    dragging=true; clearTimeout(hideTimer); hideCard();
    invoke('drag_begin').catch(err=>{notice('drag_begin failed: '+err);dragging=false;});
  }
});
document.addEventListener('mouseup',e=>{
  if(e.button!==0)return;
  if(press&&!dragging&&press.id) refreshRing(press.id);
  press=null;
});
// The Mac's right-click menu, naming the ring or card under the pointer; WebView2's own menu never shows
document.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(dragging||!pointerInHot(e.clientX,e.clientY)) return;
  // The command returns once the menu has closed, which is when folding may be thought about again
  menuOpen=true;
  invoke('show_notch_menu',{provider:cellAt(e.clientX,e.clientY)||hoverId}).catch(err=>notice('show_notch_menu failed: '+err))
    .finally(()=>{ menuOpen=false; scheduleFold(); });
});
listen('drag_end',()=>{dragging=false;press=null;reportHot();scheduleFold();}).catch(()=>{});

function notice(msg){
  const n=document.getElementById('notice');
  n.textContent=msg;n.classList.add('show');
  clearTimeout(n._h);n._h=setTimeout(()=>n.classList.remove('show'),6000);
}

/* ---- The handles ----------------------------------------------------------
   Settings past the far end of the pill, move past the near one. Placed whenever the hot rectangles
   are reported, since those follow every change to the pill. Hover is a circle round each fillet's
   centre, as on the Mac, not the whole box; the card gives way while either is under the pointer.
   A click on the settings orb opens Settings; holding the move handle carries the notch. */
const orb=document.getElementById('orb'), moveHandle=document.getElementById('move');
const HANDLE_REACH=28.5; // the Mac's hot zone, half of 57
let orbAt=null, moveAt=null, hovered=null, orbSpins=0, moveSpins=0, showMove=true, carrying=false;
function put(el,x,y,z){
  el.style.left=(x/z-HANDLE_REACH)+'px'; el.style.top=(y/z-HANDLE_REACH)+'px';
  el.classList.add('placed');
  return {x,y,reach:HANDLE_REACH*z};
}
function placeHandles(){
  const r=pill.getBoundingClientRect();
  if(!r.width) return false;
  // Measurements come back zoomed when fitZoom has zoomed the page; styles are written unzoomed
  const z=parseFloat(document.documentElement.style.zoom)||1;
  const R=(parseFloat(getComputedStyle(pill).getPropertyValue('--fillet'))||38.7)*z;
  // Each fillet's centre: the corner of its square diagonally opposite the one on the screen edge
  const far=notchEdge==='left'?[r.left+R,r.bottom+R]:notchEdge==='top'?[r.right+R,r.top+R]
    :notchEdge==='bottom'?[r.right+R,r.bottom-R]:[r.right-R,r.bottom+R];
  const near=notchEdge==='left'?[r.left+R,r.top-R]:notchEdge==='top'?[r.left-R,r.top+R]
    :notchEdge==='bottom'?[r.left-R,r.bottom-R]:[r.right-R,r.top-R];
  orbAt=put(orb,far[0],far[1],z);
  // No point at all when it is switched off, since hover, the press and the hot area all read this
  moveAt=showMove?put(moveHandle,near[0],near[1],z):null;
  if(!showMove) moveHandle.classList.remove('placed','hover');
  return true;
}
function near(at,x,y){ return !!at&&Math.hypot(x-at.x,y-at.y)<=at.reach; }
function onHandle(x,y){ return near(orbAt,x,y)?'orb':near(moveAt,x,y)?'move':null; }
function setHovered(which){
  if(which===hovered) return;
  hovered=which;
  orb.classList.toggle('hover',which==='orb');
  moveHandle.classList.toggle('hover',which==='move'||carrying);
}
document.addEventListener('mouseout',e=>{ if(!e.relatedTarget&&!carrying) setHovered(null); });
orb.addEventListener('click',e=>{
  if(!near(orbAt,e.clientX,e.clientY)) return;
  orb.style.setProperty('--spins',++orbSpins);
  pressIn(orb);
  callq('open_settings').catch(()=>{});
});
// The Mac's press: down fast, back with a little bounce
function pressIn(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.animate([{transform:'scale(1)',easing:'ease-out'},{transform:'scale(.84)',offset:.21,easing:'cubic-bezier(.34,1.56,.64,1)'},{transform:'scale(1)'}],{duration:430});
}
/* Holding the move handle puts the notch in hand: Rust raises the drop zones and follows the pointer
   until the button comes up. The notch itself does not move — what is being chosen is a place on the
   screen, not a distance. The pill's own size goes with it, so a zone is the notch, not a guess. */
/* The shape the zones draw: the pill standing upright, whichever edge it is on now. Worked out from
   the parts it is made of rather than measured, so a notch lying flat still offers the same
   silhouette everywhere — the 70 px depth and the 18 px end padding are the pill's own, from the CSS
   above. The notch really is shallower and shorter lying flat, but drawing that would offer four
   outlines of two sizes, which reads as four different things instead of one notch offered a place. */
function pillShapes(){
  const cells=Math.max(1,pill.querySelectorAll('.cell').length);
  const ring=(pill.querySelector('.ringwrap')||{}).offsetHeight||44;
  const label=(pill.querySelector('.pct')||{}).offsetHeight||20;
  const ends=36, between=14, underRing=6;
  return { depth:70, length:ends+cells*(ring+underRing+label)+(cells-1)*between };
}
moveHandle.addEventListener('mousedown',e=>{
  if(e.button!==0||!near(moveAt,e.clientX,e.clientY)) return;
  e.stopPropagation();
  carrying=true;
  moveHandle.classList.add('armed','hover');
  moveHandle.style.setProperty('--spins',++moveSpins);
  clearTimeout(hideTimer); hideCard();
  callq('begin_move',pillShapes()).catch(()=>{carrying=false;moveHandle.classList.remove('armed');});
});
listen('move_end',()=>{ carrying=false; moveHandle.classList.remove('armed'); setHovered(null); reportHot(); scheduleFold(); }).catch(()=>{});

/* Show on hover, the Mac's .onHover. It opens on contact and folds a moment after the pointer has gone.
   Rust says which (notch_pointer): once click-through is back on, the page is sent nothing at all. It
   never folds mid-carry, mid-drag or under the right-click menu, all of which take the pointer off the
   notch on purpose — folding under them is what #239's reviewers caught, so it is ruled out here. */
const FOLD_GRACE=450; // NotchWindowController.foldGrace
function foldAllowed(){ return onHover&&!pointerIn&&!carrying&&!dragging&&!menuOpen; }
function setFolded(f){
  if(f===folded) return;
  folded=f;
  if(f){ clearTimeout(hideTimer); hideCard(); setHovered(null); }
  document.body.classList.toggle('folded',f);
  reportHot();
}
function unfold(){ clearTimeout(foldTimer); setFolded(false); }
function scheduleFold(){
  clearTimeout(foldTimer);
  if(!onHover){ setFolded(false); return; }
  if(foldAllowed()) foldTimer=setTimeout(()=>{ if(foldAllowed()) setFolded(true); },FOLD_GRACE);
}
function applyUiFlags(f){ onHover=!!(f&&f.notch_on_hover); scheduleFold(); }
listen('notch_pointer',e=>{ pointerIn=e.payload===true; if(pointerIn) unfold(); else scheduleFold(); }).catch(()=>{});
listen('ui_flags',e=>applyUiFlags(e.payload)).catch(()=>{});
listen('pill_backdrop',e=>{
  if(e.payload==='dark'||e.payload==='light') document.body.dataset.behind=e.payload;
  else delete document.body.dataset.behind;
}).catch(()=>{});
invoke('get_ui_flags').then(applyUiFlags).catch(()=>{});
listen('move_handle',e=>{ showMove=e.payload!==false; reportHot(); }).catch(()=>{});
invoke('get_move_handle').then(v=>{ showMove=v!==false; reportHot(); }).catch(()=>{});

listen('workbuddy',e=>{usage=e.payload||usage;settle('workbuddy');renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(workbuddy) failed: '+e));
listen('state',e=>{stateSnap=e.payload||stateSnap;setUiLanguage(stateSnap.lang_resolved);renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(state) failed: '+e));
listen('notice',e=>notice(e.payload)).catch(()=>{});
listen('codex',e=>{codexSnap=e.payload||codexSnap;settle('codex');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('cursor',e=>{cursorSnap=e.payload||cursorSnap;settle('cursor');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_cursor').then(u=>{cursorSnap=u||cursorSnap;renderRing();}).catch(()=>{});
listen('dsh',e=>{dshSnap=e.payload||dshSnap;settle('dsh');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_dsh').then(u=>{dshSnap=u||dshSnap;renderRing();}).catch(()=>{});

listen('antigravity',e=>{agSnap=e.payload||agSnap;settle('gemini');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_antigravity').then(u=>{agSnap=u||agSnap;renderRing();}).catch(()=>{});
listen('cyberbrain',e=>{brain=e.payload||brain;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_cyberbrain').then(v=>{brain=v||brain;renderRing();}).catch(()=>{});
listen('glm',e=>{glmSnap=e.payload||glmSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_glm').then(u=>{glmSnap=u||glmSnap;renderRing();}).catch(()=>{});
listen('opencode',e=>{opencodeSnap=e.payload||opencodeSnap;settle('opencode');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_opencode').then(u=>{opencodeSnap=u||opencodeSnap;renderRing();}).catch(()=>{});
invoke('get_notch_slots').then(v=>{if(Array.isArray(v)){notchSlots=v;renderRing();}}).catch(()=>{});
listen('notch_slots',e=>{
  notchSlots=Array.isArray(e.payload)?e.payload:null;
  renderRing();
  if(card.classList.contains('show')){renderCard();armWatchdog();}
}).catch(()=>{});
invoke('get_antigravity_prefs').then(p=>{if(p){agPrefs=p;renderRing();}}).catch(()=>{});
invoke('get_weekly_ring').then(v=>{if(typeof v==='string'){weeklyRing=v;renderRing();}}).catch(()=>{});
listen('weekly_ring',e=>{if(typeof e.payload==='string'){weeklyRing=e.payload;renderRing();}}).catch(()=>{});
invoke('get_color_transition').then(v=>{if(typeof v==='string'){colorTransition=v;renderRing();}}).catch(()=>{});
listen('color_transition',e=>{if(typeof e.payload==='string'){colorTransition=e.payload;renderRing();}}).catch(()=>{});
listen('antigravity_prefs',e=>{if(e.payload){agPrefs=e.payload;renderRing();}}).catch(()=>{});
listen('glyphs',e=>{glyphs=e.payload||glyphs;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('activity',e=>{activity=e.payload||activity;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_activity').then(a=>{activity=a||activity;renderRing();}).catch(()=>{});
invoke('get_glyphs').then(g=>{glyphs=g||glyphs;renderRing();}).catch(()=>{});
// The edge: pushed on every placement (a drag that snapped elsewhere, or Settings), and asked for once
// at startup in case the placement happened before this page was listening.
listen('notch_edge',e=>applyEdge(e.payload)).catch(()=>{});
// applyEdge measures for the edge it is given; on the right-hand one it returns early, so the first
// measurement is made here either way — and still made if the ask fails, from the default edge.
invoke('get_notch_edge').then(e=>{applyEdge(e);reportDpr();}).catch(()=>reportDpr());
invoke('get_codex').then(u=>{codexSnap=u||codexSnap;renderRing();}).catch(()=>{});
invoke('get_workbuddy').then(u=>{usage=u||usage;renderRing();}).catch(e=>notice('get_workbuddy failed: '+e));
invoke('get_state').then(s=>{stateSnap=s||stateSnap;setUiLanguage(stateSnap.lang_resolved);renderRing();}).catch(()=>{});
setInterval(renderRing,30_000); // stale state and reset copy move with time
</script>
</body>
</html>
